[package]
name = "ad_trait"
version = "0.3.0"
edition = "2021"
description = "Easy to use, efficient, and highly flexible automatic differentiation in Rust"
authors = ["Danny Rakita <daniel.rakita@yale.edu>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/djrakita/ad_trait"
readme = "README.md"
keywords = ["autodiff", "differentiation", "derivatives", "AD"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Latest versions
nalgebra_latest = { package = "nalgebra", version = "0.34", default-features = false, features = ["alloc", "libm"], optional = true }
bevy_reflect_latest = { package = "bevy_reflect", version = "0.18", optional = true }

# WASM Compatible versions
nalgebra_compat = { package = "nalgebra", version = "0.33", default-features = false, features = ["alloc", "libm"], optional = true }
bevy_reflect_compat = { package = "bevy_reflect", version = "0.17.3", optional = true }

# Unchanged dependencies
rand = { version = "0.8.5", default-features = false, features = ["alloc"], optional = true }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
simba = { version = "0.9.1", default-features = false, features = ["libm"] }
approx = { version = "0.5.1", default-features = false }
once_cell = "1.21.3"
tinyvec = {version = "1.10.0", features = ['alloc', 'serde'] }
serde = { version="1.0", default-features = false, features=["derive", "alloc"] }
ndarray = { version = "0.17.1", default-features = false }
serde_with = { version="3.16.1", default-features = false, features = ["alloc", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["latest_deps", "std", "bevy", "rand", "serde", "hessian"]
wasm_compat = ["nalgebra_compat"]
latest_deps = ["nalgebra_latest"]

std = [
    "nalgebra_compat?/std",
    "nalgebra_latest?/std",
    "num-traits/std",
    "simba/std",
    "approx/std",
    "rand?/std",
    "rand?/std_rng",
    "serde/std",
    "ndarray/std",
    "serde_with/std",
    "tinyvec/std"
]
bevy = ["bevy_reflect_compat", "bevy_reflect_latest"]
rand = ["dep:rand", "nalgebra_compat?/rand", "nalgebra_latest?/rand"]
serde = ["nalgebra_compat?/serde-serialize", "nalgebra_latest?/serde-serialize"]
nightly = []
hessian = []

[profile.dev]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "thin"
